services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    # Settings are managed in .env; the values below override the ones that
    # must differ inside Docker (database host, production mode).
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-anim_ed}
      DB_USERNAME: ${DB_USERNAME:-anim_ed}
      DB_PASSWORD: ${DB_PASSWORD:-anim_ed_secret}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - storage:/var/www/html/storage

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-anim_ed}
      MYSQL_USER: ${DB_USERNAME:-anim_ed}
      MYSQL_PASSWORD: ${DB_PASSWORD:-anim_ed_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      # Exposed on 3307 so it does not clash with XAMPP's MySQL on 3306
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
  storage:
